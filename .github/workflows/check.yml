name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain for scripts/check.conf (bootstrap / spec 0001). Docker is preinstalled on
      # ubuntu-latest; Testcontainers uses it for the integration and e2e databases.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: |
          if [ -f scripts/check.conf ]; then
            ./scripts/check
          else
            echo "scripts/check.conf not present yet (pre-bootstrap) — skipping."
          fi

  # Known-vulnerability scan (docs/security.md, Dependencies). Network-dependent, so it lives here
  # and not in scripts/check. Red on high/critical findings; not a required check in branch
  # protection — a finding opens a bug report instead of blocking unrelated PRs.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx --from 'pip-audit>=2.9,<3' pip-audit --strict --require-hashes --disable-pip \
            -r "$RUNNER_TEMP/requirements.txt"
      - name: npm dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
