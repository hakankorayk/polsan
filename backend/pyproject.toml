[project]
name = "polsan-leave-manager"
version = "0.1.0"
description = "Polsan Leave Manager backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.16,<3.17",
    "grimp>=3.17,<4",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "BLE", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ['\.venv/', '/migrations/']
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Pure domain code is strictly typed (docs/conventions.md, Enforced by tooling).
module = ["*.domain", "*.domain.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
warn_return_any = true

[tool.django-stubs]
django_settings_module = "config.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "integration: needs a real PostgreSQL (Testcontainers); full profile only (auto-applied under tests/integration/)",
]

[tool.importlinter]
root_packages = ["employees", "workcalendar", "balances", "leaves", "identity", "audit", "config"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: employees may use only audit"
type = "forbidden"
source_modules = ["employees"]
forbidden_modules = ["workcalendar", "balances", "leaves", "identity"]

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: workcalendar may use only audit"
type = "forbidden"
source_modules = ["workcalendar"]
forbidden_modules = ["employees", "balances", "leaves", "identity"]

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: balances may use only audit, employees, workcalendar"
type = "forbidden"
source_modules = ["balances"]
forbidden_modules = ["leaves", "identity"]

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: leaves may use only audit, balances, employees, workcalendar"
type = "forbidden"
source_modules = ["leaves"]
forbidden_modules = ["identity"]

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: identity may use only audit, employees"
type = "forbidden"
source_modules = ["identity"]
forbidden_modules = ["workcalendar", "balances", "leaves"]

[[tool.importlinter.contracts]]
name = "Rule 2 - dependency direction: audit may use only no other module"
type = "forbidden"
source_modules = ["audit"]
forbidden_modules = ["employees", "workcalendar", "balances", "leaves", "identity"]

[[tool.importlinter.contracts]]
name = "Rule 3 - employees.domain is pure Python"
type = "forbidden"
source_modules = ["employees.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "workcalendar", "balances", "leaves", "identity", "audit"]

[[tool.importlinter.contracts]]
name = "Rule 3 - workcalendar.domain is pure Python"
type = "forbidden"
source_modules = ["workcalendar.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "employees", "balances", "leaves", "identity", "audit"]

[[tool.importlinter.contracts]]
name = "Rule 3 - balances.domain is pure Python"
type = "forbidden"
source_modules = ["balances.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "employees", "workcalendar", "leaves", "identity", "audit"]

[[tool.importlinter.contracts]]
name = "Rule 3 - leaves.domain is pure Python"
type = "forbidden"
source_modules = ["leaves.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "employees", "workcalendar", "balances", "identity", "audit"]

[[tool.importlinter.contracts]]
name = "Rule 3 - identity.domain is pure Python"
type = "forbidden"
source_modules = ["identity.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "employees", "workcalendar", "balances", "leaves", "audit"]

[[tool.importlinter.contracts]]
name = "Rule 3 - audit.domain is pure Python"
type = "forbidden"
source_modules = ["audit.domain"]
forbidden_modules = ["django", "rest_framework", "drf_spectacular", "employees", "workcalendar", "balances", "leaves", "identity"]
