# scripts/check.conf — Polsan Leave Manager (generated by bootstrap, 2026-10-19).
# One step per line:  <name>: <command>   — runs in order, fails fast.
# [fast] steps run in ./scripts/check --fast; ./scripts/check runs all (docs/testing.md, Two speeds).
#
# GREENFIELD: backend/ and frontend/ do not exist yet, so every step is commented out and check is a
# no-op. The first spec (project skeleton) uncomments the steps whose code it creates — and must
# show each one green, with the test count unchanged by the switches below (no silent zero-test run).
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene) — what each command could leave:
# - uv run: no daemon. --frozen: install exactly uv.lock, never resolve/update during check.
# - ruff, mypy, lint-imports: one-shot processes. mypy daemon (dmypy) is never used.
# - pytest: no xdist workers (-n not used) -> no worker survivors. -p no:cacheprovider is not needed.
# - Testcontainers: postgres container started per session, stopped+removed in the fixture finalizer.
#   Ryuk reaper disabled: it outlives the run by design (resource hygiene: no reaper container).
# - eslint, tsc: one-shot (no eslint_d, no --watch).
# - vitest: `vitest run` = run once; plain `vitest` is watch mode (resource hygiene: no watcher).
# - playwright: headless, --workers=1; webServer owns the app lifecycle (runserver --noreload,
#   vite preview), stopped at the end incl. failure/timeout; e2e postgres via global setup/teardown.
# - npm ci / playwright install are NOT check steps (CI setup + one-time local setup).
#
# --- backend (cwd backend/) ---
backend lint [fast]: cd backend && uv run --frozen ruff check . && uv run --frozen ruff format --check .
backend types [fast]: cd backend && uv run --frozen mypy .
# backend boundaries [fast]: cd backend && uv run --frozen lint-imports
backend unit [fast]: cd backend && uv run --frozen pytest -q -m "not integration"
# resource hygiene: no Ryuk reaper container; the session fixture stops the postgres container
backend integration: cd backend && TESTCONTAINERS_RYUK_DISABLED=true uv run --frozen pytest -q -m integration
#
# --- frontend (cwd frontend/) ---
# frontend lint [fast]: cd frontend && npx eslint . && npx prettier --check .
# frontend types [fast]: cd frontend && npx tsc --noEmit -p .
# resource hygiene: run once, no watch mode
# frontend unit [fast]: cd frontend && npx vitest run
# resource hygiene: single worker, headless; Playwright webServer starts and stops the app under test
# e2e: cd frontend && TESTCONTAINERS_RYUK_DISABLED=true npx playwright test --workers=1
